<div class="page animate-fade-in-up">
  <app-page-header title="Dashboard" [subtitle]="formattedDate"></app-page-header>

  <div class="stats-grid">
   @for (card of cards(); track card.title) {
  <a [routerLink]="card.route" class="stat-card">
    <div class="stat-icon" [style.color]="card.iconColor" [style.backgroundColor]="card.iconColor + '1A'">
      <i class="material-icons">{{ card.icon }}</i>
    </div>
    <div class="stat-body">
      <span class="stat-label">{{ card.title }}</span>
      @if (card.value) {
        <span class="stat-value">{{ card.value }}</span>
      }
    </div>
    <span class="stat-trend">{{ card.trend }}</span>
  </a>
}
  </div>

  <div class="dashboard-sections-grid">
    <app-section-card title="Relatórios">
      <a header-actions routerLink="/admin/relatorios" class="section-link">
        Ver todos
        <i class="material-icons" style="font-size: 16px;">arrow_forward</i>
      </a>

      <div class="quick-links">
        <a class="link-item" routerLink="/admin/relatorios/por-bioma">Por Bioma</a>
        <a class="link-item" routerLink="/admin/relatorios/especies/fichas-tecnicas">Fichas Técnicas</a>
        <a class="link-item" routerLink="/admin/relatorios/estoque/alertas">Alertas de Estoque</a>
        <a class="link-item" routerLink="/admin/relatorios/estoque/previsao">Previsão de Reposição</a>
        <a class="link-item" routerLink="/admin/relatorios/alertas/criticos">Alertas Críticos</a>
      </div>
    </app-section-card>

    <app-section-card title="Atalhos">
      <div class="quick-actions">
        <a class="btn-primary btn-sm" routerLink="/admin/area-florestal/nova">
          <i class="material-icons" style="font-size: 16px;">add</i>
          Nova Área
        </a>
        <a class="btn-primary btn-sm" routerLink="/admin/recursos/novo">
          <i class="material-icons" style="font-size: 16px;">add</i>
          Novo Recurso
        </a>
        <a class="btn-primary btn-sm" routerLink="/admin/especies/nova">
          <i class="material-icons" style="font-size: 16px;">add</i>
          Nova Espécie
        </a>
      </div>
    </app-section-card>
  </div>
</div>
