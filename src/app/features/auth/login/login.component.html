<div class="login-page">
  <div class="login-left">
    <div class="login-left-content">
      <div class="brand-icon">
        <i class="material-icons">park</i>
      </div>
      <h1 class="brand-title">CGAF</h1>
      <p class="brand-desc">Sistema de Gestão Florestal</p>
      <p class="brand-sub">Controle, monitore e gerencie suas operações florestais de forma simples e eficiente.</p>
    </div>
  </div>

  <div class="login-right">
    <div class="login-form-wrapper animate-fade-in-up">
      <h2 class="form-title">Entrar</h2>
      <p class="form-subtitle">Acesse sua conta para continuar</p>

      <form (ngSubmit)="onSubmit()" class="login-form">
        @if (authService.loginError()) {
        <div class="error-banner animate-slide-down">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
          <span>{{ authService.loginError() }}</span>
        </div>
        }

        <div class="form-group">
          <label for="email" class="label">E-mail</label>
          <input id="email" type="email" class="input-field" placeholder="seu.email&#64;exemplo.com" [(ngModel)]="email"
            name="email" required autocomplete="email" (keydown.enter)="$event.preventDefault(); passwordInput.focus()" />
        </div>

        <div class="form-group">
          <label for="password" class="label">Senha</label>
          <div class="password-wrapper">
            <input #passwordInput id="password" [type]="showPassword() ? 'text' : 'password'" class="input-field"
              placeholder="••••••••" [(ngModel)]="senha" name="senha" required autocomplete="current-password" (keydown.enter)="$event.preventDefault(); loginButton.click()" />
            <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())"
              aria-label="Mostrar senha">
              @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
              } @else {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              }
            </button>
          </div>
        </div>

        <button #loginButton type="submit" class="btn-primary login-btn" [disabled]="authService.isLoading() || !email || !senha">
          @if (authService.isLoading()) {
            <span>Entrando...</span>
          } @else {
            <span>Entrar</span>
          }
        </button>
      </form>

      <p class="login-footer">CGAF — UCSAL © {{ currentYear }}</p>
    </div>
  </div>
</div>
