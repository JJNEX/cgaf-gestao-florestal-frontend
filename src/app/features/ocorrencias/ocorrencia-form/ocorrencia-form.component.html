<div class="page animate-fade-in-up">
  <app-page-header title="Nova Ocorrência" subtitle="Registre uma ocorrência em campo">
    <button page-actions class="btn-secondary btn-sm" (click)="goBack()">
      <i class="material-icons" style="font-size: 16px;">arrow_back</i>
      Voltar
    </button>
    <button page-actions class="btn-primary btn-sm" (click)="submit()" [disabled]="form.invalid || isSubmitting()">
      <i class="material-icons" style="font-size: 16px;">save</i>
      Salvar
    </button>
  </app-page-header>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="edit-form">
      <div class="form-row">
        <div class="form-group">
          <label class="label" for="tipo">Tipo <span class="required">*</span></label>
          <select id="tipo" class="input-field select-field" formControlName="tipo">
            <option value="" disabled>Selecione</option>
            @for (t of tipoOptions; track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label class="label" for="urgencia">Urgência <span class="required">*</span></label>
          <select id="urgencia" class="input-field select-field" formControlName="urgencia">
            <option value="" disabled>Selecione</option>
            @for (u of urgenciaOptions; track u) {
              <option [value]="u">{{ u }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="label" for="descricao">Descrição <span class="required">*</span></label>
        <textarea id="descricao" rows="4" class="input-field" formControlName="descricao"></textarea>
      </div>
      
      <div class="form-group">
        <label class="label" for="areaFlorestalId">Área Florestal <span class="required">*</span></label>
        <select id="areaFlorestalId" class="input-field select-field" formControlName="areaFlorestalId">
          <option value="" disabled>Selecione</option>
          @if(isLoadingAreas()) {
            <option disabled>Carregando áreas florestais...</option>
          }
          @for (area of areaFlorestalOptions(); track area) {
            <option [value]="area.id">{{ area.nome }}</option>
          }
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="label" for="latitude">Latitude <span class="required">*</span></label>
          <input id="latitude" type="number" class="input-field" formControlName="latitude" />
        </div>
        <div class="form-group">
          <label class="label" for="longitude">Longitude <span class="required">*</span></label>
          <input id="longitude" type="number" class="input-field" formControlName="longitude" />
        </div>
      </div>

      <div class="form-group">
        <label class="label" for="fotos">Fotos</label>
        <input type="file" name="fotos" id="fotos" multiple (change)="onFileChange($event)" class="input-field" />
      </div>
    </form>
  </div>
</div>
