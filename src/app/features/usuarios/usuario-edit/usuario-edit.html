<div class="page animate-fade-in-up">
  <app-page-header
    title="Perfil do Usuário"
    subtitle="Informações do usuário">
    
    <button page-actions class="btn-secondary btn-sm" (click)="goBack()">
      <i class="material-icons" style="font-size: 16px;">arrow_back</i>
      Voltar
    </button>
    <button page-actions class="btn-primary btn-sm" (click)="onSubmit()" disabled="form.invalid">
      <i class="material-icons" style="font-size: 16px;">edit</i>
      Atualizar Senha
    </button>
  </app-page-header>

  @if (isLoading()) {
    <div class="flex justify-center" style="padding: 4rem 0;">
      <app-spinner [size]="40" message="Carregando dados do usuário..."></app-spinner>
    </div>
  } @else if (error()) {
    <app-error-card 
      [message]="error()!" 
      (retry)="loadUsuario()">
    </app-error-card>
  } @else {

    <div class="form-card">
      <div class="form-row">
        <div class="form-group">
          <span class="collab-role">Nome</span>
          <span>{{form.get('nome')?.value}}</span>
        </div>
        <div class="form-group">
          <span class="collab-role">E-mail</span>
          <span>{{form.get('email')?.value}}</span>
        </div>
      </div>
    </div>

    <div class="form-card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="edit-form">
        
        <div class="form-row">
          <div class="form-group">
            <label for="nome" class="label">Senha <span class="required">*</span></label>
            <input id="nome" type="password" class="input-field" formControlName="senha"/>
          </div>
          <div class="form-group">
            <label for="email" class="label">Confirmar Senha <span class="required">*</span></label>
            <input id="email" type="password" class="input-field" formControlName="confirmarSenha"/>
          </div>
        </div>

      </form>
    </div>
  }
</div>
